# OBS Project Configuration for home:AvengeMedia:dms / home:AvengeMedia:dms-git
# OBS project metadata (prjconf)
# To apply changes: osc meta prjconf home:AvengeMedia:dms -F distro/obs-project.conf
#                   osc meta prjconf home:AvengeMedia:dms-git -F distro/obs-project.conf

# Debian sid (dpkg 1.23) dropped the `tar` dependency from dpkg-dev, so tar no
# longer lands in the OBS buildroot preinstall set and dpkg fails on the first
# package install with "'tar' not found in PATH". Force-preinstall it.
%if "%{?_repository}" == "Debian_Unstable"
Preinstall: tar
%endif
