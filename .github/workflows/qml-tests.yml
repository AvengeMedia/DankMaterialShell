name: QML tests

on:
  pull_request:
    branches: [master, main, "stable-*"]
    paths:
      - "quickshell/**"
      - "dank-qml-common"
      - "Makefile"
      - "flake.*"
      - "distro/nix/**"
      - ".github/workflows/qml-tests.yml"

permissions:
  contents: read

jobs:
  test-qml:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run QML tests
        run: nix develop --command make test-qml
